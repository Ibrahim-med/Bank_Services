# =====================================================================
# "demo" profile - start with SPRING_PROFILES_ACTIVE=demo
#
# Same configuration as application.properties, plus the fictitious
# demo dataset (src/main/resources/db/demo/V100__demo_data.sql), which
# Flyway loads once, right after the schema migrations V1..V3.
# Use it on a NEW, EMPTY database only (default: bank_services_demo).
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bank_services_demo?createDatabaseIfNotExist=true}
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Demo mode: keep the console readable.
spring.jpa.show-sql=false
