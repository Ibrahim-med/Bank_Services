spring.application.name=bankservices_api

# Load local secrets (JWT_SECRET, DB_PASSWORD, ...) from a .env file in the working
# directory when present, so the app also starts outside the IDE run configuration.
spring.config.import=optional:file:.env[.properties]


# Database URL (override with DB_URL, e.g. to point to another database).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankservices?createDatabaseIfNotExist=true}
# Database account used at runtime. Defaults to root for backward compatibility;
# set DB_USERNAME / DB_PASSWORD to a least-privilege account (SELECT, INSERT,
# UPDATE, DELETE only), see scripts/db/least-privilege-users.sql.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Schema migrations may use a separate account with DDL rights (CREATE, ALTER...).
# Defaults to the runtime account, i.e. the current behaviour.
spring.flyway.user=${FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate

# Flyway database migrations (src/main/resources/db/migration).
# The existing database is baselined at V1 (V1 is never executed on it);
# V2+ are applied automatically at startup, before Hibernate validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing BankServices schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000


# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.frontend-url=http://localhost:5173

# Validity of the account activation link sent to new clients (hours).
app.activation-token-validity-hours=48

# ---------------------------------------------------------------------
# API rate limiting (Bucket4j). Requests above a limit get HTTP 429 with
# Retry-After and RateLimit-* headers. Windows use ISO-8601 or 1m / 15m syntax.
# Public auth endpoints are limited per client IP; the others per
# authenticated user (or per IP when not signed in).
# NOTE: limits are kept in memory: they reset when the backend restarts and
# are not shared between several backend instances (use Redis to scale out).
# ---------------------------------------------------------------------
app.rate-limit.enabled=true
app.rate-limit.login.capacity=5
app.rate-limit.login.window=1m
app.rate-limit.activation.capacity=5
app.rate-limit.activation.window=15m
app.rate-limit.resend-activation.capacity=3
app.rate-limit.resend-activation.window=15m
# forgot-password and reset-password share this limit
app.rate-limit.password-reset.capacity=3
app.rate-limit.password-reset.window=15m
app.rate-limit.bill-payment.capacity=5
app.rate-limit.bill-payment.window=1m
# POST /api/transactions: deposits, withdrawals and transfers
app.rate-limit.transfer.capacity=5
app.rate-limit.transfer.window=1m
app.rate-limit.general.capacity=100
app.rate-limit.general.window=1m
app.rate-limit.max-tracked-clients=100000
# Only set this when the API is behind a reverse proxy you control: comma-separated
# IPs/CIDRs of that proxy. Empty = X-Forwarded-For is ignored (direct connections).
app.rate-limit.trusted-proxies=

server.port=8080

# Error responses never include exception messages, stack traces, bound values
# or exception class names (also the Spring Boot defaults; pinned explicitly).
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false