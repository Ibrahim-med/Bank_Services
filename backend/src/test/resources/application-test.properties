# =====================================================================
# Test profile - activated with @ActiveProfiles("test")
# Overrides src/main/resources/application.properties so that tests
# NEVER connect to the real MySQL database or a real SMTP server.
# =====================================================================

# In-memory H2 database in MySQL compatibility mode.
# LOCK_TIMEOUT is raised so concurrent-transaction tests wait for row locks.
spring.datasource.url=jdbc:h2:mem:bankservices_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema is generated from the JPA entities for each test context.
spring.jpa.hibernate.ddl-auto=create-drop

# Flyway scripts target MySQL; the H2 test schema comes from the entities.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Fake signing key (base64) used only by tests.
jwt.secret=dGVzdC1vbmx5LWp3dC1zaWduaW5nLWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlISE=
jwt.expiration=3600000

# Dummy mail settings. Integration tests replace JavaMailSender with a mock.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=no-reply@bankservices.test
spring.mail.password=not-a-real-password

app.frontend-url=http://localhost:5173

# Rate limiting is off for the functional suites (they log in many times per
# minute); RateLimitIntegrationTest switches it on with its own small limits.
app.rate-limit.enabled=false
