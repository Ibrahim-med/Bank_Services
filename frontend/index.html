<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BankServices – secure banking management platform" />
    <title>BankServices</title>

    <!-- Fonts: Inter (body), Outfit (headings), Barlow Semi Condensed (labels/buttons).
         Linked from the document (not a CSS @import) so they start loading immediately. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600&display=swap"
    />

    <!-- Apply the saved theme before the first paint to avoid a light flash in dark mode. -->
    <script>
      (function () {
        var mode = "light";
        try {
          if (localStorage.getItem("bankservices-theme") === "dark") mode = "dark";
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", mode);
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === "dark" ? "#0A1220" : "#F7F2EA";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
